name: Release

# Tag a commit to publish an APK. The tag is the single source of truth for the
# version: v1.2.3 becomes versionName 1.2.3 and versionCode 10203, so a rebuild
# of the same tag is reproducible and a later tag can always upgrade over it.
#
# Never rebuild the same tag twice: the publisher refuses to replace assets,
# because a second APK with the same versionCode makes Android report
# "App already installed" instead of updating. Move the tag or cut a new one.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

env:
  PERIOD_TIMER_RELEASE: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          echo "tag=$TAG"                      >> "$GITHUB_OUTPUT"
          echo "name=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "code=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          # SDK 57 minimum is Node 22.13.x.
          node-version: "22.13.x"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check tag matches app.json
        run: |
          WANT="${{ steps.tag.outputs.name }}"
          HAVE=$(node -p "require('./app.json').expo.version")
          if [ "$WANT" != "$HAVE" ]; then
            echo "::error::Tag $WANT does not match expo.version $HAVE in app.json. Bump app.json first."
            exit 1
          fi

      - name: Exclude the Expo dev client from autolinking
        run: bun scripts/release-mode.mjs

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set on this repo."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          echo "PERIOD_TIMER_KEYSTORE=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"
          echo "Keystore restored."

      - name: Generate the native project
        run: bunx expo prebuild --no-install
        env:
          PERIOD_TIMER_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PERIOD_TIMER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PERIOD_TIMER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PERIOD_TIMER_VERSION_CODE: ${{ steps.tag.outputs.code }}
          PERIOD_TIMER_VERSION_NAME: ${{ steps.tag.outputs.name }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Tag-triggered runs default to read-only caches, which throws the
          # Gradle cache away every release (~20 min cold builds forever).
          # Writing it back makes every release after the first much faster.
          cache-read-only: false
          cache-overwrite-existing: true

      - name: Assemble the release APK
        working-directory: android
        env:
          PERIOD_TIMER_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PERIOD_TIMER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PERIOD_TIMER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect the APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::No APK produced by assembleRelease."
            exit 1
          fi
          # Guard against a debug-signed APK ever being published: the cert
          # must be the documented release key. A debug-signed upload would
          # refuse to install as an upgrade over every prior release.
          # keytool -printcert -jarfile only reads v1 (JAR) signatures, but
          # minSdk >= 24 means AGP emits v2/v3 signatures only and keytool
          # prints nothing — so read the signing cert with apksigner, which
          # understands every scheme. Output lines look like:
          #   Signer #1 certificate SHA-256 digest: AA:BB:...
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools"/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under ANDROID_HOME=$ANDROID_HOME."
            exit 1
          fi
          # sed must stop at the LAST colon pair before the hex (": "), not
          # greedy '.*:' which would eat the fingerprint's own colons. Grep -o
          # over the whole line achieves the same with less footgun. Note the
          # tolerates-failure || true: with pipefail, a grep miss would
          # otherwise kill the step before the clear empty-FP error below.
          FP=$("$APKSIGNER" verify --print-certs "$SRC" 2>/dev/null | grep -o 'certificate SHA-256 digest:.*' | sed 's/^certificate SHA-256 digest: *//' | tr -d '[:space:]' || true)
          EXPECTED="AE:DC:06:EA:CB:98:DE:25:7A:87:A6:4F:AA:4F:7A:8B:03:AB:95:F6:05:0C:7F:1D:2E:6C:40:86:87:6C:5E:BC"
          if [ -z "$FP" ]; then
            echo "::error::Could not read the APK signing certificate."
            exit 1
          fi
          # Compare case-insensitively and colon-blind: apksigner prints
          # lowercase hex without separators, keytool prints uppercase with
          # colons — the cert, not the formatting, is what matters.
          FP_NORM=$(printf '%s' "$FP" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_NORM=$(printf '%s' "$EXPECTED" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ "$FP_NORM" != "$EXPECTED_NORM" ]; then
            echo "::error::APK is signed with an unexpected certificate: $FP"
            echo "::error::Refusing to publish a non-release-signed APK."
            exit 1
          fi
          mkdir -p dist
          # A fixed name keeps the /releases/latest/download/ link stable forever.
          cp "$SRC" dist/period-timer.apk
          cd dist
          sha256sum period-timer.apk > SHA256SUMS
          cat SHA256SUMS
          echo "size=$(stat -c%s period-timer.apk)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.tag.outputs.name }}
          CODE: ${{ steps.tag.outputs.code }}
        run: |
          set -euo pipefail
          # A tag ships exactly one binary. If this release already has assets,
          # the tag was rebuilt — re-uploading would publish a second APK with
          # the same versionCode, and Android then reports
          # "App already installed" instead of updating. Cut a new version.
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          if [ "$ASSETS" != "0" ]; then
            echo "::error::Release $TAG already has assets. Never rebuild the same tag:"
            echo "::error::the same versionCode twice makes Android refuse the update."
            echo "::error::Cut a new version (bump app.json too), then tag that."
            exit 1
          fi
          NOTES=$(cat <<EOF
          Period Timer $NAME (versionCode $CODE)

          - Weekly timetable: one preset per weekday; an empty day means no
            lectures — timer, alarms and notifications stay off
          - Teacher and room stored per period, shown on the timer, the
            schedule list and the widget
          - Custom alarm ringtone that rings even when the app is closed, on
            your phone's alarm volume rather than media volume
          - Stop the alarm from the notification or from the app
          - Live progress notification with countdown and bar
          - Download \`period-timer.apk\` (all ABIs: arm64-v8a, armeabi-v7a, x86, x86_64)
          - Verify with \`SHA256SUMS\`

          Installing a sideloaded build: Android asks you to allow
          "Install unknown apps" for the browser you downloaded from, once.
          The app also needs exact-alarm and notification permission for the
          live countdown to survive the screen turning off.
          EOF
          )
          gh release create "$TAG" \
            dist/period-timer.apk dist/SHA256SUMS \
            --title "Period Timer $NAME" \
            --notes "$NOTES" \
            --latest
          echo "https://github.com/${{ github.repository }}/releases/latest/download/period-timer.apk"
